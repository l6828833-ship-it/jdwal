# Netlify config for the jdwal (Next.js 16) frontend.
#
# Netlify supports Next.js 16 with zero extra config via its OpenNext adapter.
# It detects Next.js automatically and manages the build output and routing
# itself, so we must NOT set `publish` — pinning it to ".next" makes Netlify
# treat the app as a plain static folder, which serves 404 for every route.
# Only the Node version is pinned here; the adapter does the rest.

[build.environment]
  # Next.js 16 requires Node >= 20.9. Use an LTS release comfortably above that.
  NODE_VERSION = "20.18.0"
