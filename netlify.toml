# Netlify config for the jdwal (Next.js 16) frontend.
#
# The site's auto-detected Runtime came up "Not set", so the Next.js adapter was
# not applied and every route 404'd. Declaring the plugin explicitly (and adding
# it to devDependencies) forces the Next.js runtime on, which handles SSR,
# API routes and routing. Do NOT set `publish` — the plugin manages the output.

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build]
  command = "next build"

[build.environment]
  # Next.js 16 requires Node >= 20.9.
  NODE_VERSION = "20.18.0"
