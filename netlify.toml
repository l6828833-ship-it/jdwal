# Netlify config for the jdwal (Next.js 16) frontend.
#
# The Next.js Runtime is forced on by declaring the plugin here and adding it to
# devDependencies (auto-detection came up "Not set" and every route 404'd).

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build]
  command = "next build"
  # With the Next.js plugin installed, publish MUST be ".next" — the plugin
  # reads that build output and turns it into serverless/edge functions.
  # (It must NOT be the repo root, which the plugin rejects.)
  publish = ".next"

[build.environment]
  # The Next.js Runtime v5 plugin needs Node >= 20.19; use 22.x to clear the
  # engine warnings too.
  NODE_VERSION = "22.23.2"
